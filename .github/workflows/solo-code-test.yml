name: Solo-Code tests

on:
  push:
    paths:
      - "Solo-Code/**"
      - ".github/workflows/solo-code-test.yml"
  pull_request:
    paths:
      - "Solo-Code/**"

defaults:
  run:
    working-directory: Solo-Code

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: "Lint (changed files)" diffs against main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      # Advisory: the whole package still has pre-existing prettier errors in untouched files.
      - name: Lint (all, advisory)
        run: npm run lint
        continue-on-error: true

      # Blocking: every lint-able file this push/PR touches must be clean, so the debt cannot grow.
      - name: Lint (changed files, blocking)
        run: |
          git fetch --no-tags origin main
          base=$(git merge-base FETCH_HEAD HEAD)
          files=$(git diff --name-only --relative --diff-filter=ACMR "$base" HEAD -- . | grep -E '\.(js|mjs|cjs|ts|tsx)$' || true)
          if [ -z "$files" ]; then echo "no lint-able files changed since $base"; exit 0; fi
          echo "$files"
          echo "$files" | xargs npx eslint --no-error-on-unmatched-pattern

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build + service_role bundle guard
        run: |
          npm run build
          if grep -r 'service_role' dist/; then
            echo "FAIL: service_role found in client bundle"
            exit 1
          fi

      # Still advisory: as of 2026-11-03 the audit reports high/critical advisories in transitive
      # (mostly dev) dependencies. Make it blocking once `npm audit --audit-level=high` passes locally.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Public smoke (curl)
        run: BASE_URL=https://solofreelancer.com npm run smoke:public
