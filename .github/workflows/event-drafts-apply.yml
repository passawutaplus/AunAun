name: Apply event scout batches

# The weekly "SAMECOR event scout" routine opens a PR adding
# Solo-Code/supabase/event-drafts/<date>.sql. Once that PR is merged, this applies the new
# file(s) to production through the event_scout role. A statement decides what it creates:
# scout_event_draft(...) a DRAFT for the team, scout_event_publish(...) a published event
# (owner decision 2026-11-27, see Solo-Code/supabase/event-drafts/README.md). For events with
# "cover_source_url" the organiser's poster is first stored in our own storage
# (.github/scripts/event-scout-covers.mjs; needs the SUPABASE_SERVICE_ROLE_KEY secret, and
# simply skips pictures without it). Already-merged files are not re-run: only files added or
# changed by the merge commit are applied.

on:
  push:
    branches: [main]
    paths:
      - "Solo-Code/supabase/event-drafts/*.sql"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client

      - name: Apply new batch files
        env:
          EVENT_SCOUT_DB_URL: ${{ secrets.EVENT_SCOUT_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EVENT_SCOUT_DB_URL" ]; then
            echo "EVENT_SCOUT_DB_URL secret is not set" >&2; exit 1
          fi
          files=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'Solo-Code/supabase/event-drafts/*.sql')
          if [ -z "$files" ]; then echo "no new draft files"; exit 0; fi
          for f in $files; do
            echo "== $f"
            ready="$RUNNER_TEMP/$(basename "$f")"
            node .github/scripts/event-scout-covers.mjs "$f" "$ready"
            psql "$EVENT_SCOUT_DB_URL" -v ON_ERROR_STOP=1 -q -f "$ready"
          done
