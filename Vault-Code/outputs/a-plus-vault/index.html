<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A+ Vault</title>
  <meta name="description" content="A private creative reference vault for Aplus." />
  <meta name="robots" content="noindex,nofollow" />
  <base href="/" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" content="#101113" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="A+ Vault" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="preload" href="/assets/fonts/Agrandir-Wide-Light.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/styles.css" as="style" />
  <link rel="modulepreload" href="/app.js" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div class="boot-skeleton" aria-label="Loading A+ Vault">
      <div class="boot-topbar">
        <span class="skeleton-box mark"></span>
        <span class="skeleton-line title"></span>
        <span class="skeleton-line search"></span>
        <span class="skeleton-dot"></span>
      </div>
      <div class="boot-grid">
        <aside>
          <span class="skeleton-pill"></span>
          <span class="skeleton-pill"></span>
          <span class="skeleton-pill short"></span>
        </aside>
        <main>
          <span class="skeleton-line wide"></span>
          <div class="boot-cards">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </main>
      </div>
    </div>
  </div>
  <script src="/vault-runtime.js"></script>
  <script src="/supabase-config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
