<!doctype html>
<html style="background:transparent!important;background-color:rgba(0,0,0,0)!important">
  <head>
    <meta charset="UTF-8">
    <title>Vault by Aplus</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body style="background:transparent!important;background-color:rgba(0,0,0,0)!important">
    <main class="popup">
      <header class="popup-header">
        <div class="popup-brand">
          <img class="mark mark-icon" src="icons/icon-48.png" alt="" aria-hidden="true">
          <div>
            <h1>Vault</h1>
            <p>by Aplus</p>
          </div>
        </div>
        <button id="openVaultBtn" class="header-vault-button" type="button">Open Vault</button>
      </header>

      <section class="status" id="status" data-type="default" hidden></section>

      <section class="home-actions" id="homeActions" aria-label="Keep">
        <button id="keepAllBtn" class="primary keep-button" type="button"><span id="keepAllLabel">Keep all images</span></button>
      </section>

      <section class="quick-card" id="quickCard" hidden aria-live="polite">
        <div class="quick-thumb" id="quickThumb"></div>
        <div class="quick-body">
          <strong id="quickTitle">Kept</strong>
          <span id="quickWhere">Kept in My Vault</span>
          <div class="quick-actions-row">
            <button id="quickUndoBtn" class="secondary" type="button">Undo</button>
            <button id="quickEditBtn" class="secondary" type="button">Edit details</button>
            <button id="quickOffBtn" class="ghost" type="button">Turn off quick keep</button>
          </div>
          <div class="quick-bar" aria-hidden="true"><i id="quickBar"></i></div>
        </div>
      </section>

      <section class="queue-row" id="queueRow" hidden>
        <span id="queueText">Waiting to send</span>
        <button id="queueRetryBtn" class="secondary" type="button">Retry now</button>
        <button id="queueClearBtn" class="ghost" type="button">Remove</button>
      </section>

      <section class="capture-card" id="captureCard" hidden>
        <div class="capture-preview" id="capturePreview"></div>
        <div class="capture-meta">
          <span id="captureType">Object</span>
          <strong id="captureSource">Ready to keep</strong>
        </div>
        <div class="duplicate-hint" id="duplicateHint" hidden></div>

        <div class="capture-actions">
          <button id="keepPendingBtn" class="primary keep-button">
            <img class="button-icon" src="icons/icon-keep-white-32.png?v=2" alt="" aria-hidden="true" width="16" height="16">
            <span>Keep in Vault</span>
          </button>
        </div>

        <label for="titleInput">Title</label>
        <input id="titleInput" type="text" placeholder="Object title">

        <label for="collectionInput">Collection</label>
        <div class="collection-field">
          <select id="collectionInput" aria-label="Collection">
            <option value="all">My Vault</option>
          </select>
          <input id="newCollectionInput" type="text" placeholder="Type collection name…" hidden aria-label="New collection name">
        </div>

Note</label>
        <textarea id="noteInput" placeholder="Add context..."></textarea>

        <label class="toggle-row" for="quickKeepInput">
          <input id="quickKeepInput" type="checkbox">
          <span>Quick keep — skip this form next time</span>
        </label>

      </section>

      <section class="quick-actions" aria-label="Quick actions">
        <button id="uploadZone" class="upload-zone secondary" type="button" aria-label="Upload files in the Vault web app">
          <span>Upload file</span>
        </button>

        <button id="snapshotBtn" class="snapshot-zone secondary" type="button">
          <span>Snapshot</span>
        </button>
      </section>

      <section class="recent-section">
        <div class="section-head">
          <h2>Recently kept</h2>
          <button id="clearRecentBtn" class="ghost" type="button">Clear</button>
        </div>
        <div id="recentList" class="recent-list">
          <p class="empty-state">No recent captures yet.</p>
        </div>
      </section>

      <section class="settings">
        <section class="connect-row" id="connectRow">
          <span id="connectText">Not connected</span>
          <button id="disconnectBtn" class="ghost" type="button" hidden>Disconnect</button>
        </section>
        <label class="toggle-row" for="smartDetectInput">
          <input id="smartDetectInput" type="checkbox">
          <span>Smart image detection on all sites <small>(asks permission once)</small></span>
        </label>
        <label class="toggle-row" for="hoverKeepInput">
          <input id="hoverKeepInput" type="checkbox">
          <span>Show Keep buttons when hovering images</span>
        </label>
        <details>
          <summary>Advanced: paste a token</summary>
          <label for="tokenInput">Alpha API Token</label>
          <input id="tokenInput" type="password" placeholder="Copy from Vault Settings → Extension sync">
          <p class="settings-hint">Paste the sync token from your Vault Profile after logging in.</p>

          <label for="apiBaseInput">API Base</label>
          <input id="apiBaseInput" type="url" placeholder="https://aplus-vault.vercel.app">

          <button id="saveSettingsBtn" class="secondary">Save settings</button>
        </details>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
