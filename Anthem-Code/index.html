    <meta property="og:type" content="website" />

    <meta property="og:description" content="You create. We connect. — โชว์งาน เชื่อมต่อ และเติบโตไปกับคอมมูนิตี้ครีเอทีฟ" />

    <meta name="twitter:image" content="https://aplus1.app/icons/icon-512.png" />
  </head>

  <body>
    <script>
      (function () {
        try {
          var key = "an1hem-theme";
          var stored = localStorage.getItem(key);
          var preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || "system";
          var dark = theme === "dark" || (theme === "system" && preferDark);
          if (dark) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
