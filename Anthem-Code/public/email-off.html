<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>อีเมลสรุปรายสัปดาห์ — SAMECOR</title>
    <!--
      /email/off?u=…&t=… (vercel.json rewrite): the one-click "เลิกรับอีเมลนี้" link of the weekly summary e-mail.
      email-off.js asks the weekly-digest edge function to turn the e-mail off (signed link, no sign-in) and
      offers to turn it back on. Plain page, no app code, so it works before and after the redesign cutover.
    -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #f2f2f0; color: #282929; }
      body {
        display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
        box-sizing: border-box; font-family: "IBM Plex Sans Thai", "Elms Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 300;
      }
      main { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e4e4e0; border-radius: 16px; padding: 32px 28px; box-sizing: border-box; }
      .logo { display: block; width: 120px; height: auto; margin: 0 0 28px; }
      h1 { font-size: 20px; line-height: 1.4; font-weight: 400; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #696966; margin: 0 0 24px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      button, a.btn {
        font: inherit; font-size: 14px; border-radius: 999px; padding: 10px 20px; cursor: pointer; text-decoration: none;
        border: 1px solid #282929; background: #282929; color: #fff;
      }
      a.link { font-size: 14px; color: #282929; }
      button[hidden], a[hidden] { display: none; }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/email/logo-horizontal.png" alt="SAMECOR" width="120" />
      <h1 id="title">กำลังปิดอีเมลสรุปรายสัปดาห์…</h1>
      <p id="sub">รอสักครู่</p>
      <div class="row">
        <button type="button" id="toggle" hidden></button>
        <a class="link" id="home" href="/">ไปที่ SAMECOR</a>
      </div>
    </main>
    <script src="/email-off.js"></script>
  </body>
</html>
