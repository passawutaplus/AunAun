<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="ราคางานต่อกันเป็นชั้น ชั้นล่างคือต้นทุน ต่อด้วยเวลาที่ใช้ ค่าประสบการณ์ และกำไรสีแดงด้านบน แล้วรวมเป็นราคาที่เสนอ">
<style>.l{opacity:0;animation:s 9s cubic-bezier(.2,.8,.2,1) infinite}@keyframes s{0%{opacity:0;transform:translateY(-40px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}.arrow,.q{opacity:0;animation:q 9s ease infinite;animation-delay:3.4s}@keyframes q{0%{opacity:0}10%,50%{opacity:1}65%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important}}</style>
<rect width="800" height="360" fill="#F8F7F2"/>
<line x1="60" y1="320" x2="740" y2="320" stroke="#282929" stroke-width="2"/><rect class="l end" x="330" y="230" width="140" height="90" fill="#E6E6E3" style="animation-delay:0.3s"/><rect class="l end" x="330" y="150" width="140" height="80" fill="#666" style="animation-delay:1.1s"/><rect class="l end" x="330" y="90" width="140" height="60" fill="#282929" style="animation-delay:1.9s"/><rect class="l end" x="330" y="50" width="140" height="40" fill="#EE3D29" style="animation-delay:2.7s"/><path class="arrow end" d="M500 160 L620 160" stroke="#EE3D29" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect class="end q" x="640" y="80" width="90" height="240" fill="none" stroke="#282929" stroke-width="2.5" stroke-dasharray="6 6"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#EE3D29"/></marker></defs>
</svg>
