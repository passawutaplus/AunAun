<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="ด้านซ้าย วงกลมสีเข้มเดิมได้เส้นขอบสีแดงเพิ่ม แทนการปรับเล็กน้อย ด้านขวา วงกลมจางหายแล้วมีสี่เหลี่ยมสีแดงมาแทน แทนการเปลี่ยนทั้งหมด">
<style>.r{stroke-dasharray:380;stroke-dashoffset:380;animation:r 9s ease-in-out infinite}@keyframes r{0%,15%{stroke-dashoffset:380}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:380}}.o{animation:o 9s ease-in-out infinite}@keyframes o{0%,30%{opacity:1}50%,85%{opacity:0}100%{opacity:1}}.n{opacity:0;animation:n 9s ease-in-out infinite}@keyframes n{0%,40%{opacity:0}60%,85%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
<line x1="400" y1="50" x2="400" y2="290" stroke="#C9C9C5" stroke-width="2"/><circle cx="220" cy="170" r="60" fill="#282929"/><circle class="r end" cx="220" cy="170" r="60" fill="none" stroke="#EE3D29" stroke-width="6" transform="rotate(-90 220 170)"/><circle class="o" cx="580" cy="170" r="60" fill="#282929"/><rect class="n end" x="525" y="115" width="110" height="110" fill="#EE3D29"/>
</svg>
