<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="แถบข้อความหลายแถบที่เท่ากันทั้งหมด ค่อยๆ เปลี่ยนเป็นหัวข้อใหญ่ หัวข้อรอง เนื้อหา และคำอธิบายเล็กสีแดง">
<style>.r{transform-box:fill-box;transform-origin:left center;animation:s 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes s{0%,20%{transform:scaleY(var(--s))}45%,85%{transform:scaleY(1)}100%{transform:scaleY(var(--s))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important}}</style>
<rect width="800" height="360" fill="#F8F7F2"/>
