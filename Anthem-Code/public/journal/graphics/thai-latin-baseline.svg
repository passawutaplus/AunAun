<g class="t end" style="transform-origin:560px 230px"><rect x="430" y="146" width="70" height="84" rx="30" fill="#666"/><rect x="514" y="146" width="70" height="84" rx="30" fill="#666"/><rect x="598" y="146" width="80" height="84" rx="30" fill="#666"/><rect x="540" y="112" width="28" height="12" rx="6" fill="#666"/><rect x="620" y="244" width="22" height="14" rx="6" fill="#666"/></g>
</svg>
