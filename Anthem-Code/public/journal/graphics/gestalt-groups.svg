<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="จุดสิบสองจุดเรียงห่างเท่ากัน แล้วค่อยๆ ขยับเข้าใกล้กันเป็นสามกลุ่ม กลุ่มกลางเป็นสีแดง แสดงว่าระยะใกล้ทำให้เรามองเห็นเป็นกลุ่ม">
<style>.p{animation:p 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes p{0%,15%{transform:var(--d)}45%,85%{transform:none}100%{transform:var(--d)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
