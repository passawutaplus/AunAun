<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="เส้นเวลาเริ่มจากจุดสีแดงตอนสร้างงาน แถบสีเข้มยืดออกแทนช่วงชีวิตผู้สร้าง แล้วแถบสีเทาต่อออกไปอีกช่วงหลังเส้นประ แทนระยะคุ้มครองหลังเสียชีวิต">
<style>.g{transform-box:fill-box;transform-origin:left;animation:g 9s cubic-bezier(.3,.7,.3,1) infinite}@keyframes g{0%{transform:scaleX(0)}18%,85%{transform:none}100%{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
<line x1="80" y1="170" x2="720" y2="170" stroke="#E6E6E3" stroke-width="4"/><rect class="g end" x="100" y="150" width="340" height="40" rx="4" fill="#282929" style="animation-delay:.3s"/><rect class="g end" x="440" y="150" width="260" height="40" rx="4" fill="#C9C9C5" style="animation-delay:1.6s"/><line x1="440" y1="120" x2="440" y2="220" stroke="#666" stroke-width="2" stroke-dasharray="5 5"/><circle cx="100" cy="170" r="16" fill="#EE3D29"/>
</svg>