<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="กรอบภาพสี่กรอบขนาดต่างกันบนผนัง ค่อยๆ เลื่อนขึ้นลงจนจุดกึ่งกลางของทุกกรอบอยู่บนเส้นประสีแดงเส้นเดียวกัน">
<style>.f{animation:f 7s cubic-bezier(.2,.8,.2,1) infinite}@keyframes f{0%,12%{transform:translateY(var(--o))}45%,85%{transform:none}100%{transform:translateY(var(--o))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
<line x1="0" y1="300" x2="800" y2="300" stroke="#E6E6E3" stroke-width="4"/>
<line x1="40" y1="160" x2="760" y2="160" stroke="#EE3D29" stroke-width="2.5" stroke-dasharray="8 7"/>
<g class="f end" style="--o:-40px"><rect x="80" y="100" width="120" height="120" fill="#FFFFFF" stroke="#282929" stroke-width="5"/><rect x="98" y="118" width="84" height="84" fill="#E6E6E3"/></g>
<g class="f end" style="--o:50px"><rect x="250" y="70" width="190" height="180" fill="#FFFFFF" stroke="#282929" stroke-width="5"/><rect x="270" y="90" width="150" height="140" fill="#666"/></g>
<g class="f end" style="--o:-25px"><rect x="490" y="125" width="90" height="70" fill="#FFFFFF" stroke="#282929" stroke-width="5"/><rect x="503" y="138" width="64" height="44" fill="#E6E6E3"/></g>
<g class="f end" style="--o:30px"><rect x="620" y="110" width="100" height="100" fill="#FFFFFF" stroke="#282929" stroke-width="5"/><rect x="634" y="124" width="72" height="72" fill="#666"/></g>
</svg>
