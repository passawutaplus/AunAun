<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="โลโก้เล็กๆ ตรงกลาง แล้วจุดสัมผัสต่างๆ ปรากฏรอบตัวทีละจุด สุดท้ายมีวงสีแดงล้อมทั้งหมดไว้ คือแบรนด์">
<style>.tp{opacity:0;animation:t 9s ease infinite}@keyframes t{0%{opacity:0}6%,85%{opacity:1}100%{opacity:0}}.ring{opacity:0;stroke-dasharray:1500;stroke-dashoffset:1500;animation:r 9s ease infinite;animation-delay:3.6s}@keyframes r{0%{opacity:1;stroke-dashoffset:1500}25%,55%{opacity:1;stroke-dashoffset:0}70%,100%{opacity:0;stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important}}</style>
<rect width="800" height="360" fill="#F8F7F2"/>
<g class="tp end" style="animation-delay:0.6s"><line x1="400" y1="180" x2="400" y2="50" stroke="#E6E6E3" stroke-width="2"/><circle cx="400" cy="50" r="20" fill="#666"/></g><g class="tp end" style="animation-delay:0.95s"><line x1="400" y1="180" x2="577" y2="88" stroke="#E6E6E3" stroke-width="2"/><circle cx="577" cy="88" r="14" fill="#282929"/></g><g class="tp end" style="animation-delay:1.2999999999999998s"><line x1="400" y1="180" x2="650" y2="180" stroke="#E6E6E3" stroke-width="2"/><circle cx="650" cy="180" r="20" fill="#282929"/></g><g class="tp end" style="animation-delay:1.65s"><line x1="400" y1="180" x2="577" y2="272" stroke="#E6E6E3" stroke-width="2"/><circle cx="577" cy="272" r="14" fill="#666"/></g><g class="tp end" style="animation-delay:2.0s"><line x1="400" y1="180" x2="400" y2="310" stroke="#E6E6E3" stroke-width="2"/><circle cx="400" cy="310" r="20" fill="#282929"/></g><g class="tp end" style="animation-delay:2.35s"><line x1="400" y1="180" x2="223" y2="272" stroke="#E6E6E3" stroke-width="2"/><circle cx="223" cy="272" r="14" fill="#282929"/></g><g class="tp end" style="animation-delay:2.6999999999999997s"><line x1="400" y1="180" x2="150" y2="180" stroke="#E6E6E3" stroke-width="2"/><circle cx="150" cy="180" r="20" fill="#666"/></g><g class="tp end" style="animation-delay:3.05s"><line x1="400" y1="180" x2="223" y2="88" stroke="#E6E6E3" stroke-width="2"/><circle cx="223" cy="88" r="14" fill="#282929"/></g><circle cx="400" cy="180" r="26" fill="#fff" stroke="#282929" stroke-width="3"/><circle cx="400" cy="180" r="9" fill="#282929"/><ellipse class="ring end" cx="400" cy="180" rx="300" ry="168" fill="none" stroke="#EE3D29" stroke-width="2.5"/>
</svg>
