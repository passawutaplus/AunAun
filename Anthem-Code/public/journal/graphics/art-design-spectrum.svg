<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="เส้นยาวหนึ่งเส้น ปลายซ้ายเป็นวงกลมแทนการแสดงออก ปลายขวาเป็นสี่เหลี่ยมแทนการใช้งาน จุดห้าจุดเลื่อนไปหยุดคนละตำแหน่งตลอดเส้น จุดกลางเป็นสีแดง">
<style>.m{animation:m 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes m{0%,12%{transform:translateX(var(--x))}45%,85%{transform:none}100%{transform:translateX(var(--x))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
<line x1="100" y1="170" x2="700" y2="170" stroke="#E6E6E3" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="170" r="10" fill="#666"/><rect x="690" y="160" width="20" height="20" fill="#666"/><circle class="m end" cx="150" cy="170" r="18" fill="#282929" style="--x:260px"/><circle class="m end" cx="290" cy="170" r="18" fill="#666" style="--x:-90px"/><circle class="m end" cx="400" cy="170" r="18" fill="#EE3D29" style="--x:130px"/><circle class="m end" cx="520" cy="170" r="18" fill="#666" style="--x:-200px"/><circle class="m end" cx="640" cy="170" r="18" fill="#282929" style="--x:-310px"/>
