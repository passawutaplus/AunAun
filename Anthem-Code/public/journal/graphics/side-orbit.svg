<circle cx="400" cy="170" r="125" fill="none" stroke="#C9C9C5" stroke-width="2" stroke-dasharray="4 8"/><circle cx="400" cy="170" r="70" fill="#282929"/><g class="r"><circle cx="525" cy="170" r="22" fill="#EE3D29"/></g>
