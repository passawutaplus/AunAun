<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="วงกลมใหญ่สีเข้มอยู่ตรงกลาง มีวงกลมเล็กสีแดงโคจรรอบช้าๆ แทนโปรเจกต์ส่วนตัวที่หมุนอยู่รอบงานหลัก">
