<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="การ์ด 4 ใบเรียงกัน คือ โจทย์ ทางเลือก อุปสรรค และผลลัพธ์ มีเส้นสีแดงลากผ่านทีละใบ และตกลงต่ำที่ใบที่สามก่อนขึ้นสูงที่ใบสุดท้าย">
<style>
.c{fill:#fff;stroke:#282929;stroke-width:2}
.l{fill:none;stroke:#EE3D29;stroke-width:3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:dr 6s ease-in-out infinite}
.p{fill:#EE3D29;opacity:0;animation:pp 6s ease-in-out infinite}
.p2{animation-delay:.9s}.p3{animation-delay:1.8s}.p4{animation-delay:2.7s}
@keyframes dr{0%{stroke-dashoffset:900;opacity:1}55%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes pp{0%,5%{opacity:0}15%,90%{opacity:1}100%{opacity:0}}
.ln{stroke:#282929;stroke-width:3;stroke-linecap:round;opacity:.25}
@media (prefers-reduced-motion:reduce){.l{animation:none;stroke-dashoffset:0}.p{animation:none;opacity:1}}
</style>
<rect width="800" height="360" fill="#F8F7F2"/>
<g>
<rect class="c" x="40" y="90" width="150" height="180" rx="10"/>
<rect class="c" x="230" y="90" width="150" height="180" rx="10"/>
<rect class="c" x="420" y="90" width="150" height="180" rx="10"/>
<rect class="c" x="610" y="90" width="150" height="180" rx="10"/>
</g>
<g class="ln">
<line x1="64" y1="230" x2="166" y2="230"/><line x1="64" y1="248" x2="130" y2="248"/>
<line x1="254" y1="230" x2="356" y2="230"/><line x1="254" y1="248" x2="320" y2="248"/>
<line x1="444" y1="230" x2="546" y2="230"/><line x1="444" y1="248" x2="510" y2="248"/>
<line x1="634" y1="230" x2="736" y2="230"/><line x1="634" y1="248" x2="700" y2="248"/>
</g>
<path class="l" d="M115 160 C 200 160, 230 130, 305 135 S 420 210, 495 195 S 610 110, 685 120"/>
<circle class="p" cx="115" cy="160" r="9"/>
<circle class="p p2" cx="305" cy="135" r="9"/>
<circle class="p p3" cx="495" cy="195" r="9"/>
<circle class="p p4" cx="685" cy="120" r="9"/>
</svg>
