<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="กราฟแท่งสามแท่งไล่จากสูงไปต่ำ แท่งสุดท้ายสีแดงเตี้ยที่สุด แสดงเวลาเฉลี่ยที่คนจดจ่อกับจอหนึ่งก่อนสลับที่ลดลงตามปี">
<style>.b{transform-box:fill-box;transform-origin:bottom;animation:b 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes b{0%{transform:scaleY(0)}15%,85%{transform:none}100%{transform:scaleY(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
<line x1="160" y1="290" x2="640" y2="290" stroke="#C9C9C5" stroke-width="2"/><rect class="b end" x="200" y="70" width="100" height="220" fill="#282929" style="animation-delay:0.0s"/><rect class="b end" x="350" y="180" width="100" height="110" fill="#666666" style="animation-delay:0.5s"/><rect class="b end" x="500" y="221" width="100" height="69" fill="#EE3D29" style="animation-delay:1.0s"/>
