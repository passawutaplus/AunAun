<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="การ์ดข้อความสั้นสามบรรทัดค่อยๆ ปรากฏ เส้นประวิ่งไปหาวงกลมฝั่งขวา แล้วมีจุดสีแดงขึ้นที่วงกลมเหมือนได้รับคำตอบ">
<style>.l{transform-box:fill-box;transform-origin:left;animation:l 9s ease-out infinite}@keyframes l{0%{transform:scaleX(0)}15%,88%{transform:none}100%{transform:scaleX(0)}}.p{stroke-dasharray:8 10;stroke-dashoffset:420;animation:p 9s linear infinite}@keyframes p{0%,20%{stroke-dashoffset:420}45%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:420}}.d{opacity:0;transform-box:fill-box;transform-origin:center;animation:d 9s ease-out infinite}@keyframes d{0%,48%{opacity:0;transform:scale(.3)}58%,88%{opacity:1;transform:none}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
