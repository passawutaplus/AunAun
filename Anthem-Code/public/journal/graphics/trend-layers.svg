<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="แท่งฐานสีเข้มอยู่นิ่ง ส่วนชั้นบนบางๆ สีต่างๆ เปลี่ยนสลับไปเรื่อยๆ">
<style>.t{opacity:0;animation:t 8s ease infinite}@keyframes t{0%{opacity:0;transform:translateY(-30px)}5%,22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateY(-10px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important}}</style>
<rect width="800" height="360" fill="#F8F7F2"/>
<rect x="200" y="210" width="400" height="90" fill="#282929"/><rect class="t end" x="200" y="170" width="400" height="34" fill="#666" style="animation-delay:0s"/><rect class="t" x="200" y="170" width="400" height="34" fill="#E6E6E3" style="animation-delay:2s"/><rect class="t" x="200" y="170" width="400" height="34" fill="#EE3D29" style="animation-delay:4s"/><rect class="t" x="200" y="170" width="400" height="34" fill="#666" style="animation-delay:6s"/>
</svg>
