<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="กล่องความเห็นห้ากล่องกระจายอยู่ทางซ้าย ค่อยๆ เคลื่อนมารวมกันเป็นกล่องเดียวทางขวา ที่มีบรรทัดสรุปและบรรทัดสีแดงหนึ่งบรรทัด">
<style>.m{animation:m 8s cubic-bezier(.4,0,.2,1) infinite}@keyframes m{0%,15%{transform:var(--d);opacity:1}45%{transform:none;opacity:1}52%,100%{transform:none;opacity:0}}.f{opacity:0;animation:f 8s ease-out infinite}@keyframes f{0%,45%{opacity:0}55%,88%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.m{display:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
<rect width="800" height="340" fill="#F8F7F2"/>
<g class="m end" style="--d:translate(-450px,-90px)"><rect x="560" y="150" width="70" height="44" rx="10" fill="#666666"/></g><g class="m end" style="--d:translate(-470px,0px)"><rect x="560" y="150" width="70" height="44" rx="10" fill="#999999"/></g><g class="m end" style="--d:translate(-430px,90px)"><rect x="560" y="150" width="70" height="44" rx="10" fill="#666666"/></g><g class="m end" style="--d:translate(-340px,-50px)"><rect x="560" y="150" width="70" height="44" rx="10" fill="#999999"/></g><g class="m end" style="--d:translate(-350px,60px)"><rect x="560" y="150" width="70" height="44" rx="10" fill="#666666"/></g><rect class="f end" x="530" y="120" width="160" height="100" rx="14" fill="#282929"/><rect class="f end" x="552" y="148" width="100" height="10" rx="5" fill="#F8F7F2"/><rect class="f end" x="552" y="170" width="80" height="10" rx="5" fill="#EE3D29"/>
</svg>