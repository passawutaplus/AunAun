<rect class="t end" x="230" y="40" width="100" height="80" rx="4" fill="#282929" style="--d:translate(-80px,-22px) rotate(-11deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="350" y="40" width="100" height="80" rx="4" fill="#EE3D29" style="--d:translate(169px,-10px) rotate(1deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="470" y="40" width="100" height="80" rx="4" fill="#282929" style="--d:translate(-121px,-49px) rotate(-12deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="230" y="140" width="100" height="80" rx="4" fill="#666666" style="--d:translate(-190px,-9px) rotate(3deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="350" y="140" width="100" height="80" rx="4" fill="#666666" style="--d:translate(-52px,42px) rotate(10deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="470" y="140" width="100" height="80" rx="4" fill="#666666" style="--d:translate(-170px,-32px) rotate(2deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="230" y="240" width="100" height="80" rx="4" fill="#C9C9C5" style="--d:translate(74px,-14px) rotate(-6deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="350" y="240" width="100" height="80" rx="4" fill="#C9C9C5" style="--d:translate(199px,-38px) rotate(12deg);transform-box:fill-box;transform-origin:center"/><rect class="t end" x="470" y="240" width="100" height="80" rx="4" fill="#C9C9C5" style="--d:translate(-146px,-27px) rotate(-8deg);transform-box:fill-box;transform-origin:center"/>
