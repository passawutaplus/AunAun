<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="ภาพตัวอย่างเก้าชิ้นกระจัดกระจายเอียงไปมา แล้วค่อยๆ เลื่อนมาเรียงเป็นสามแถวตามโทน แถวบนมีชิ้นสีแดงหนึ่งชิ้น">
<style>.t{animation:t 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes t{0%,12%{transform:var(--d)}45%,85%{transform:none}100%{transform:var(--d)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.end{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
