<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAMECOR — You Create. We Connect.</title>
    <meta name="description" content="A creative platform for discovering work, connecting people, and opening up opportunities." />
    <meta name="theme-color" content="#F8F7F2" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/Agrandir-Wide-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/src/go/go.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <img class="logo" src="/brand/symbol-black.svg" alt="SAMECOR" width="46" height="46" />
        <h1>You Create.<br />We Connect.</h1>
        <p class="sub">A creative platform for discovering work, connecting people, and opening up opportunities.</p>
        <a class="cta" id="web" href="https://samecor.com/">
          <svg class="cta-bg" aria-hidden="true" focusable="false"><path /></svg>
          <span class="cta-label">Explore on web</span>
          <svg class="cta-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M8 7h9v9" /></svg>
        </a>
        <div class="stores" id="stores"></div>
        <p class="follow">Follow us</p>
        <nav class="soc" id="soc" aria-label="Social links"></nav>
      </section>
      <section class="works" aria-label="Works on SAMECOR">
        <div class="mq" id="mq"></div>
      </section>
      <footer class="foot">
        <img class="foot-logo" src="/brand/logo-horizontal-black.svg" alt="SAMECOR" height="20" />
        <p class="foot-copy">© 2026 SAMECOR · All rights reserved</p>
      </footer>
    </main>
    <script type="module" src="/src/go/main.ts"></script>
  </body>
</html>
